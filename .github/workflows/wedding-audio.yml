name: Add wedding audio asset
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/wedding-audio.yml"
permissions:
  contents: write
jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch publicly shared audio
        run: |
          python -m pip install --quiet gdown
          mkdir -p vantrung-thanhhuong/assets
          gdown --id "1BA_IUNBXpi9psQxXbNSiOrKTeN6XHhZX" -O vantrung-thanhhuong/assets/background-music.m4a
          python - <<'PY'
          from pathlib import Path
          data=Path("vantrung-thanhhuong/assets/background-music.m4a").read_bytes()
          assert len(data)>1000000, "Downloaded response is too small to be audio"
          assert b"ftyp" in data[:32], "Download did not return an M4A media file"
          print(f"Audio verified: {len(data)} bytes")
          PY
      - name: Commit audio asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vantrung-thanhhuong/assets/background-music.m4a
          git diff --cached --quiet || (git commit -m "Add wedding background audio" && git push)
